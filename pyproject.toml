[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pull-requests-collector"
version = "1.2.1"  # x-release-please-version
description = "Collect pull requests from GitHub, Gitea or Forgejo and cherry-pick them in dependency order"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/vicamo/pull-requests-collector"

[project.scripts]
pull-requests-collector = "pull_requests_collector:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
