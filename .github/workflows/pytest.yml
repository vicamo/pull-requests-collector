name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pv.outputs.versions }}
    steps:
      - id: pv
        uses: vicamo/actions-library/python-versions@v1
        with:
          version-range: ">=3.10"
          latest-only: "true"
          exclude-eol: "true"
          platform: linux
          arch: x64
          freethreaded: exclude

  pytest:
    needs: python-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest
